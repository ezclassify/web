version: 2

updates:
  - package-ecosystem: npm
    directories:
      - /
    schedule:
      interval: weekly
      day: monday
    cooldown:
      # The repository refuses any third-party release published inside a
      # seven-day window (`npm run check:dependency-age`). Without a matching
      # cooldown here, Dependabot opens a bump the moment it lands and the
      # pull request fails its own quarantine gate.
      default-days: 7
    groups:
      npm-production:
        dependency-type: production
        update-types:
          - minor
          - patch
      npm-development:
        dependency-type: development
        update-types:
          - minor
          - patch
    # Ignores are per-family, not blanket. Ignoring every major meant a
    # dependency that had moved on stayed invisible until someone went looking,
    # which is the opposite of what this file is for. What stays ignored is what
    # cannot move on its own:
    #   - the Angular toolchain, which moves as one coordinated bump across the
    #     library and separately in the Angular example and e2e host;
    #   - vite and its framework plugins, which AGENTS.md requires to stay on
    #     a compatible major across the Vite examples and e2e hosts;
    #   - typescript, paired with each Angular compiler line;
    #   - first-party packages, which are updated with each release.
    ignore:
      - dependency-name: '@angular/*'
        update-types:
          - version-update:semver-major
      - dependency-name: '@angular-devkit/*'
        update-types:
          - version-update:semver-major
      - dependency-name: '@angular-eslint/*'
        update-types:
          - version-update:semver-major
      - dependency-name: 'ng-packagr'
        update-types:
          - version-update:semver-major
      - dependency-name: 'vite'
        update-types:
          - version-update:semver-major
      - dependency-name: '@vitejs/*'
        update-types:
          - version-update:semver-major
      - dependency-name: 'typescript'
        update-types:
          - version-update:semver-major
      - dependency-name: '@ezclassify/*'
    open-pull-requests-limit: 10
    labels:
      - dependencies

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    groups:
      github-actions:
        patterns:
          - '*'
        update-types:
          - minor
          - patch
    # No major ignore here: actions are pinned by commit SHA, and a major that
    # never opens a pull request is a pin nobody revisits.
    labels:
      - dependencies
      - ci
