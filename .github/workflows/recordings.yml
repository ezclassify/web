name: Recordings

# The maintainer lane: record every spec's demo runtime traffic from nothing and
# fail if the result differs from the committed recordings. It is the only
# recorder and the only freshness check (DEVELOPMENT.md, "Engine behavior in
# tests").
#
# It runs in the official repository only: on demand, every week, and on a
# pull request that changes what the recordings are made from (a spec, a
# fixture, the harness, a recording or a pin). It reads private checkouts (the
# engine the demo runtime is built from, and the content the demo set is
# assembled from), each at the commit its pin in test-support names, so a fork
# has nothing to run here and needs no secret: the job is skipped. Public CI
# replays the committed recordings and needs none of this.
#
# A stale run uploads what it recorded, for a maintainer to review and commit.

on:
  workflow_dispatch: null
  schedule:
    - cron: '17 6 * * 1'
  pull_request:
    paths:
      - '**/*.spec.ts'
      - '**/*.spec.tsx'
      - '**/__recordings__/**'
      - 'libs/ui/test-fixtures/**'
      - 'libs/ui-tools/src/record-replay/**'
      - 'test-support/**'
      - 'vendor/spec/fixtures/**'
      - 'scripts/record-demo-runtime.mjs'
      - '.github/workflows/recordings.yml'

permissions:
  contents: read
  packages: read

concurrency:
  group: recordings
  cancel-in-progress: false

jobs:
  record:
    # A pull request from a fork has no access to the private checkouts.
    if: >-
      github.repository == 'ezclassify/web' &&
      (github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          path: web
          persist-credentials: false

      - name: Read the pins the recordings are made from
        id: pin
        run: |
          for name in community-content engine orchestration; do
            echo "${name//-/_}=$(tr -d '[:space:]' < "web/test-support/${name}.pin")" >> "$GITHUB_OUTPUT"
          done

      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          repository: ezclassify/community-content
          ref: ${{ steps.pin.outputs.community_content }}
          path: community-content
          persist-credentials: false

      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          repository: ezclassify/engine
          ref: ${{ steps.pin.outputs.engine }}
          path: engine
          token: ${{ secrets.EZ_REPOS_READ_TOKEN }}
          persist-credentials: false

      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          repository: ezclassify/orchestration
          ref: ${{ steps.pin.outputs.orchestration }}
          path: orchestration
          token: ${{ secrets.EZ_REPOS_READ_TOKEN }}
          persist-credentials: false

      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          repository: ezclassify/enterprise-content
          path: enterprise-content
          token: ${{ secrets.EZ_REPOS_READ_TOKEN }}
          persist-credentials: false

      - uses: ezclassify/.github/actions/setup-node-npm@a42ece80f520858a2926723d12bba2af2dca0474
        with:
          node-version: '22'
          registry-url: 'https://npm.pkg.github.com'
          scope: '@ezclassify'

      - name: Configure package registry
        run: |
          cat > "$RUNNER_TEMP/ci-npmrc" << 'NPMRC'
          @ezclassify:registry=https://npm.pkg.github.com
          //npm.pkg.github.com/:_authToken=${NODE_AUTH_TOKEN}
          NPMRC
          echo "NPM_CONFIG_USERCONFIG=$RUNNER_TEMP/ci-npmrc" >> "$GITHUB_ENV"

      - name: Install dependencies
        working-directory: web
        env:
          NODE_AUTH_TOKEN: ${{ secrets.EZ_GHPKG_TOKEN || github.token }}
        run: |
          npm run deps:relock
          npm ci

      - name: Install the engine's Rust toolchain
        # rust-toolchain.toml in the engine checkout names it.
        working-directory: engine
        run: rustup toolchain install

      - name: Record from nothing and compare with the committed recordings
        working-directory: web
        run: npm run check:recordings

      - name: Upload what was recorded
        if: ${{ failure() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: recordings
          path: web/**/__recordings__/*.json
          if-no-files-found: ignore
          retention-days: 7
