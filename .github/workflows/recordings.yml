name: Recordings

# The maintainer lane: record every spec's demo runtime traffic from nothing and
# fail if the result differs from the committed recordings. It is the only
# recorder and the only freshness check (DEVELOPMENT.md, "Engine behavior in
# tests").
#
# It runs in the official repository on demand only; a fork has nothing to run
# here and needs no secret: the job is skipped. It reads private checkouts (the
# engine the demo runtime is built from, orchestration's assembly script, and
# the content the demo set is assembled from), each at the commit its pin in
# test-support names, so it never runs on pull requests. Public CI replays the
# committed recordings and needs none of this.
#
# A stale run uploads what it recorded, for a maintainer to review and commit.

on:
  workflow_dispatch: null

permissions:
  contents: read
  packages: read

concurrency:
  group: recordings
  cancel-in-progress: false

jobs:
  record:
    # A fork has no access to the private checkouts.
    if: github.repository == 'ezclassify/web'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: web
          persist-credentials: false

      - name: Read the pins the recordings are made from
        id: pin
        run: |
          for name in community-content enterprise-content orchestration runtime; do
            echo "${name//-/_}=$(tr -d '[:space:]' < "web/test-support/${name}.pin")" >> "$GITHUB_OUTPUT"
          done

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ezclassify/community-content
          ref: ${{ steps.pin.outputs.community_content }}
          path: community-content
          persist-credentials: false

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ezclassify/runtime
          ref: ${{ steps.pin.outputs.runtime }}
          path: runtime
          token: ${{ secrets.EZ_REPOS_READ_TOKEN }}
          persist-credentials: false

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ezclassify/orchestration
          ref: ${{ steps.pin.outputs.orchestration }}
          path: orchestration
          token: ${{ secrets.EZ_REPOS_READ_TOKEN }}
          persist-credentials: false

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ezclassify/enterprise-content
          ref: ${{ steps.pin.outputs.enterprise_content }}
          path: enterprise-content
          token: ${{ secrets.EZ_REPOS_READ_TOKEN }}
          persist-credentials: false

      - uses: ezclassify/.github/actions/setup-node-npm@da1e243029be7e724f808cca11e385e6d79eee8b
        with:
          node-version: '22'
          registry-url: 'https://npm.pkg.github.com'
          scope: '@ezclassify'

      - name: Configure package registry
        run: |
          cat > "$RUNNER_TEMP/ci-npmrc" << 'NPMRC'
          @ezclassify:registry=https://npm.pkg.github.com
          //npm.pkg.github.com/:_authToken=${NODE_AUTH_TOKEN}
          NPMRC
          echo "NPM_CONFIG_USERCONFIG=$RUNNER_TEMP/ci-npmrc" >> "$GITHUB_ENV"

      - name: Install dependencies
        working-directory: web
        env:
          NODE_AUTH_TOKEN: ${{ secrets.EZ_GHPKG_TOKEN || github.token }}
        run: |
          npm run deps:relock
          npm ci

      - name: Install the assembly script's packages
        # Its package-lock.json is one of the pinned orchestration paths.
        working-directory: orchestration
        env:
          NODE_AUTH_TOKEN: ${{ secrets.EZ_GHPKG_TOKEN || github.token }}
        run: npm ci --omit=dev --ignore-scripts

      - name: Install the runtime checkout's Rust toolchain
        # rust-toolchain.toml in the runtime checkout names it.
        working-directory: runtime
        run: rustup toolchain install

      - name: Record from nothing and compare with the committed recordings
        working-directory: web
        run: npm run check:recordings

      - name: Upload what was recorded
        if: ${{ failure() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: recordings
          path: web/**/__recordings__/*.json
          if-no-files-found: ignore
          retention-days: 7
