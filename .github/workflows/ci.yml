name: CI

# One required check: the `ci` job. It runs on every pull request to main and
# on demand. A dispatch with `full` set also runs the `full` job, the release
# evidence: Node 24 and the pack-and-consume proof on both Node versions.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      full:
        description: Also run the release-only checks (Node 24, pack and consume)
        type: boolean
        default: false

permissions:
  contents: read
  packages: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: ci
    if: github.event_name != 'push' || (github.repository == 'ezclassify/web' && github.ref == 'refs/heads/main' && vars.EZ_WEB_MAIN_SNAPSHOTS == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - uses: ezclassify/.github/actions/setup-node-npm@da1e243029be7e724f808cca11e385e6d79eee8b
        with:
          node-version: '22'
          registry-url: 'https://npm.pkg.github.com'
          scope: '@ezclassify'

      - name: Configure package registry
        run: |
          cat > "$RUNNER_TEMP/ci-npmrc" << 'NPMRC'
          @ezclassify:registry=https://npm.pkg.github.com
          //npm.pkg.github.com/:_authToken=${NODE_AUTH_TOKEN}
          NPMRC
          echo "NPM_CONFIG_USERCONFIG=$RUNNER_TEMP/ci-npmrc" >> "$GITHUB_ENV"

      - name: Test sources import no engine
        # Reads source text only and needs no install: no spec, fixture or test
        # helper may import the engine or its WebAssembly build, because a clean
        # clone cannot install them. Engine behavior arrives as recordings.
        run: npm run check:spec-imports

      - name: Public dependency closure
        # Reads the committed manifests and fails if the workspace declares a
        # package that is not published publicly, which is how the engine would
        # come back: quietly, as somebody's devDependency, breaking
        # `npm install` for every fork.
        run: npm run check:public-dependencies

      - name: Verify spec hash
        # The vendored bundle has to be the one MANIFEST.json names. This
        # repository generates nothing from it, so the hash is the whole check.
        run: |
          EXPECTED=$(python3 -c "import json; print(json.load(open('vendor/spec/MANIFEST.json'))['openapiSha256'])")
          ACTUAL=$(sha256sum vendor/spec/openapi.yaml | awk '{print $1}')
          if [ "$EXPECTED" != "$ACTUAL" ]; then
            echo "ERROR: vendor/spec/openapi.yaml SHA mismatch"
            echo "  MANIFEST: $EXPECTED"
            echo "  actual:   $ACTUAL"
            exit 1
          fi

      - name: Install dependencies
        # Generate a portable, date-bounded lock from empty state, then install
        # exactly those bytes.
        env:
          NODE_AUTH_TOKEN: ${{ secrets.EZ_GHPKG_TOKEN || github.token }}
        uses: ezclassify/.github/actions/install-node-dependencies@da1e243029be7e724f808cca11e385e6d79eee8b
        with:
          mode: generated
          relock-installs: 'false'

      - name: Lint
        run: npm run lint

      - name: Check formatting
        run: npm run format:check

      - name: Dependency license compliance
        # Validate every publishable workspace before accepting an empty closure;
        # consumer-provided peers are outside the redistributed production graph.
        run: node scripts/check-production-licenses.mjs

      - name: Third-party notices are current
        # THIRD-PARTY-NOTICES.md is generated from the direct production
        # dependencies of the publishable workspaces, so a dependency change
        # cannot land without the committed notices file following it.
        run: |
          npm run notices
          git diff --exit-code THIRD-PARTY-NOTICES.md

      - name: No dependency or import escapes the repo
        # No file:/link:/workspace: dependency protocols in publishable
        # packages, and no relative import that resolves above the repo root.
        run: npm run check:no-escape

      - name: Build UI
        run: npm run build
        working-directory: libs/ui

      - name: Build React integration
        run: npm run build
        working-directory: integrations/react

      - name: Build Vue integration
        run: npm run build
        working-directory: integrations/vue

      - name: Build Angular integration
        run: npm run build
        working-directory: integrations/angular

      - name: Typecheck
        # After the builds: the integrations and examples resolve the sibling
        # packages through their built declarations.
        run: npm run typecheck

      - name: Examples and hosts carry no engine
        # Checked rather than asserted: no dependency field names the engine,
        # no source or built file imports it, and the engine is outside the
        # closure an outside consumer would install. The gate builds every
        # application itself, so it cannot go quiet when their gitignored
        # output is absent.
        run: npm run check:consumer-engine-free -- --verbose

      - name: No published tarball carries proprietary content
        # The publication-boundary gate, as an explicit step because .npmrc sets
        # ignore-scripts=true and npm then skips the package's own
        # prepublishOnly. After the builds, because pack reflects what is on
        # disk.
        run: npm run check:publish-content

      - name: Working tree is clean after build
        run: git diff --exit-code && test -z "$(git status --porcelain)"

      - name: Run tests
        # Every spec, the integration tier included. Engine answers replay from
        # the committed demo runtime recordings, so nothing is started and
        # nothing is skipped. Whether a recorded answer is still what the engine
        # says is the maintainer lane's check, recordings.yml.
        run: npm test

      - name: Pack the tested Web snapshots
        if: github.event_name == 'push' && github.repository == 'ezclassify/web' && github.ref == 'refs/heads/main' && vars.EZ_WEB_MAIN_SNAPSHOTS == 'true'
        id: snapshot
        run: |
          set -euo pipefail
          version="$(node -p "require('./libs/ui/package.json').version.split('-')[0]")-dev.snapshot.g${GITHUB_SHA}"
          out="$RUNNER_TEMP/web-snapshot"
          mkdir -p "$out"
          for package in ui react; do
            npm pkg set "version=$version" -w "@ezclassify/$package"
            npm pkg delete publishConfig -w "@ezclassify/$package"
            npm pack --ignore-scripts --pack-destination "$out" -w "@ezclassify/$package"
          done

      - name: Retain the snapshot tarballs
        if: steps.snapshot.outcome == 'success'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: web-snapshot
          path: ${{ runner.temp }}/web-snapshot/*.tgz
          if-no-files-found: error
          retention-days: 7

  publish-snapshot:
    if: github.event_name == 'push' && github.repository == 'ezclassify/web' && github.ref == 'refs/heads/main' && vars.EZ_WEB_MAIN_SNAPSHOTS == 'true'
    needs: ci
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      packages: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: web-snapshot
          path: ${{ runner.temp }}/web-snapshot
          digest-mismatch: error
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          registry-url: https://npm.pkg.github.com
          scope: '@ezclassify'
          package-manager-cache: false
      - name: Publish and verify the tested tarballs
        env:
          NODE_AUTH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/web-snapshot"
          shopt -s nullglob
          files=(*.tgz)
          test "${#files[@]}" -eq 2
          npm_args=(--registry=https://npm.pkg.github.com --prefer-online --fetch-retries=0)
          for package in ui react; do
            # Existing package ACLs and visibility must be configured before opting in.
            test "$(npm view "@ezclassify/$package" name "${npm_args[@]}")" = "@ezclassify/$package"
          done
          for package in ui react; do
            matches=(ezclassify-"$package"-*-dev.snapshot.g"$GITHUB_SHA".tgz)
            test "${#matches[@]}" -eq 1
            file="${matches[0]}"
            version="${file#"ezclassify-$package-"}"
            version="${version%.tgz}"
            expected="sha512-$(openssl dgst -sha512 -binary "$file" | openssl base64 -A)"
            spec="@ezclassify/$package@$version"
            if ! actual="$(npm view "$spec" dist.integrity "${npm_args[@]}" 2>lookup.err)"; then
              grep -q E404 lookup.err || { cat lookup.err >&2; exit 1; }
              actual=''
            fi
            if [[ -z "$actual" ]]; then
              npm publish "./$file" --ignore-scripts --access restricted --tag dev-snapshot "${npm_args[@]}"
              actual="$(npm view "$spec" dist.integrity "${npm_args[@]}")"
            fi
            test "$actual" = "$expected"
            echo "Verified $spec" >> "$GITHUB_STEP_SUMMARY"
          done

  full:
    name: full (${{ matrix.node-version }})
    if: ${{ inputs.full }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: true
      matrix:
        # 22 is here too so the pack-and-consume proof covers both supported
        # Node versions, as the release run always did.
        node-version: ['22', '24']
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - uses: ezclassify/.github/actions/setup-node-npm@da1e243029be7e724f808cca11e385e6d79eee8b
        with:
          node-version: ${{ matrix.node-version }}
          registry-url: 'https://npm.pkg.github.com'
          scope: '@ezclassify'

      - name: Configure package registry
        run: |
          cat > "$RUNNER_TEMP/ci-npmrc" << 'NPMRC'
          @ezclassify:registry=https://npm.pkg.github.com
          //npm.pkg.github.com/:_authToken=${NODE_AUTH_TOKEN}
          NPMRC
          echo "NPM_CONFIG_USERCONFIG=$RUNNER_TEMP/ci-npmrc" >> "$GITHUB_ENV"

      - name: Install dependencies
        env:
          NODE_AUTH_TOKEN: ${{ secrets.EZ_GHPKG_TOKEN || github.token }}
        uses: ezclassify/.github/actions/install-node-dependencies@da1e243029be7e724f808cca11e385e6d79eee8b
        with:
          mode: generated
          relock-installs: 'false'

      - name: Build UI
        run: npm run build
        working-directory: libs/ui

      - name: Build React integration
        run: npm run build
        working-directory: integrations/react

      - name: Build Vue integration
        run: npm run build
        working-directory: integrations/vue

      - name: Build Angular integration
        run: npm run build
        working-directory: integrations/angular

      - name: Run tests
        run: npm test

      - name: Pack and consume publishable workspaces from tarballs
        # npm-pack every publishable workspace, install the tarballs jointly
        # into a scratch project outside the repo (sibling @ezclassify/* deps
        # must resolve from the tarballs, never a registry), then load every
        # declared entry point the way a consumer would.
        run: |
          npx playwright install --with-deps chromium
          npm run verify:pack-consume
