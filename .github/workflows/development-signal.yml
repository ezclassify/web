name: Signal development source change

on:
  push:
    branches: [main]

permissions: {}

jobs:
  signal:
    if: github.repository == 'ezclassify/web' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment:
      name: development-signal
      deployment: false
    steps:
      - name: Require the configured signal destination
        env:
          DESTINATION: ${{ secrets.EZ_DEVELOPMENT_SIGNAL_DESTINATION }}
        run: '[[ "$DESTINATION" =~ ^[a-zA-Z0-9][a-zA-Z0-9._-]*$ ]]'
      - id: signal
        uses: actions/create-github-app-token@f418cff399f7aef4c2f0ad47e25ca7a6abbdd6fc # v3.4.0
        with:
          app-id: ${{ secrets.EZ_DEVELOPMENT_SIGNAL_APP_ID }}
          private-key: ${{ secrets.EZ_DEVELOPMENT_SIGNAL_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ secrets.EZ_DEVELOPMENT_SIGNAL_DESTINATION }}
          permission-contents: write
      - name: Send the development change signal
        env:
          GH_TOKEN: ${{ steps.signal.outputs.token }}
          DESTINATION: ${{ secrets.EZ_DEVELOPMENT_SIGNAL_DESTINATION }}
        run: gh api --method POST "repos/$GITHUB_REPOSITORY_OWNER/$DESTINATION/dispatches" -f event_type=development-producer-changed
